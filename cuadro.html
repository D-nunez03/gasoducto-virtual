<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuadro de mando · Junta Directiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#071a30;--ink:#0a2442;--ink-2:#14365c;--paper:#eef3f2;--muted:#a9bcc2;--accent:#f39b23;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--f-body:"IBM Plex Sans",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--f-body)}
body{min-height:100vh;background:radial-gradient(1200px 600px at 85% -10%,#12406e 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#0d3355 0%,transparent 55%),var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding:clamp(18px,3vw,40px) clamp(16px,3vw,40px) 28px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:clamp(18px,2.4vw,30px)}
.brand{display:flex;align-items:center;gap:18px}
.brand img{height:44px;background:#fff;padding:6px 10px;border-radius:6px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{margin:4px 0 0;font-family:var(--f-display);font-weight:600;font-size:clamp(30px,3.6vw,48px);line-height:1;letter-spacing:.01em}
.meta{text-align:right;font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.6}
.meta b{display:inline-block;color:var(--paper);font-weight:500;background:var(--ink-2);padding:3px 10px;border-radius:999px;margin-bottom:4px}
.pend{color:#f3d27a}
.grid{display:grid;grid-template-columns:1fr 2fr 2fr;gap:clamp(14px,1.6vw,22px);align-items:start}
.sec{margin-bottom:14px}.tiles{display:grid;gap:10px}.tiles.c2{grid-template-columns:1fr 1fr}
.sec h2{margin:0 0 10px;font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:8px;border-bottom:2px solid var(--ink-2)}
.tile{position:relative;background:color-mix(in srgb,var(--ink) 88%,transparent);border:1px solid var(--ink-2);border-radius:8px;padding:12px 14px 11px 16px;overflow:hidden;
  opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.tile.in{opacity:1;transform:none}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#5c6f7a)}
.tn{font-size:13.5px;line-height:1.25;color:#d5e0e1;min-height:2.5em}
.tv{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.tv strong{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,2.3vw,36px);line-height:1;font-variant-numeric:tabular-nums}
.tv strong small{font-size:.45em;font-weight:500;color:var(--muted);margin-left:4px}
.pill{font-family:var(--f-mono);font-size:13px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--c);color:#08131d;white-space:nowrap}
.pill.na{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.tp{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:#ffffff14;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);border-radius:2px;transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
footer{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-top:16px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 5px 0 14px;vertical-align:0}
.leg i:first-child{margin-left:0}
@media (max-width:1100px){.grid{grid-template-columns:1fr 1fr}.blk2{grid-column:span 2}}
@media (max-width:620px){.grid{grid-template-columns:1fr}.blk2{grid-column:auto}.tiles.c2{grid-template-columns:1fr}}
@media (max-width:620px){.grid{grid-template-columns:1fr}.meta{text-align:left}}
@media (prefers-reduced-motion:reduce){.tile,.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img src="logo.png" alt="Surtigas, una empresa Promigas">
      <div><div class="eyebrow">Gerencia de Operaciones</div><h1>Cuadro de mando</h1></div></div>
    <div class="meta" id="meta"></div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>
    <div class="leg" id="leg"></div>
    <div>% de ejecución = Real / Ppto · indicadores inversos (menor es mejor) = Ppto / Real</div>
  </footer>
</div>
<script>
fetch('kpis.json?t='+Date.now()).then(r=>r.json()).then(K=>{
  const col=e=>{if(e==null)return null;for(const [m,c] of K.semaforo)if(e>=m)return c;return K.semaforo.at(-1)[1];};
  const fmt=e=>String(Math.round(e*10)/10).replace('.',',')+' %';
  document.getElementById('meta').innerHTML=`<b>Corte ${K.corte}</b><br>`+(K.pendiente?'<span class="pend">Pendiente de actualizar al corte de octubre 2026</span>':'Junta Directiva');
  document.getElementById('leg').innerHTML='% de ejecución: '+K.semaforo.map(([m,c,t])=>`<i style="background:${c}"></i>${t}`).join('');
  const g=document.getElementById('grid');
  const blocks=[{cols:1,secs:[0,1]},{cols:2,secs:[2]},{cols:2,secs:[3]}];
  blocks.forEach(bk=>{const B=document.createElement('div'); if(bk.cols>1)B.className='blk2';
    bk.secs.forEach(pi=>{const c=document.createElement('section'); c.className='sec'; c.innerHTML=`<h2>${K.perspectivas[pi]}</h2>`;
      const T=document.createElement('div'); T.className='tiles'+(bk.cols>1?' c2':''); c.appendChild(T);
      Object.values(K.kpis).filter(k=>k.p===pi).forEach(k=>{
        const cc=col(k.ejec), u=k.unidad&&!/%/.test(k.unidad)&&k.unidad!=='#'?`<small>${k.unidad}</small>`:'';
        const t=document.createElement('div'); t.className='tile'; if(cc)t.style.setProperty('--c',cc);
        t.innerHTML=`<div class="tn">${k.nombre}</div><div class="tv"><strong>${k.real??'—'}${k.real?u:''}</strong>`+
          `<span class="pill${cc?'':' na'}">${cc?fmt(k.ejec):'pendiente'}</span></div>`+
          `<div class="tp"><span>Ppto ${k.ppto??'—'}</span><span>${k.nota?'<b style="color:#f3d27a;font-weight:500">'+k.nota+'</b>':(k.inverso?'menor es mejor':'')}</span></div>`+
          `<div class="bar"><i data-w="${k.ejec==null?0:Math.min(100,k.ejec)}"></i></div>`;
        T.appendChild(t);});
      B.appendChild(c);});
    g.appendChild(B);});
  const tiles=[...document.querySelectorAll('.tile')];
  const show=()=>tiles.forEach((t,i)=>setTimeout(()=>{t.classList.add('in');const b=t.querySelector('.bar i');b.style.width=b.dataset.w+'%';},80*i));
  if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){show();io.disconnect();}},{threshold:.15});io.observe(g);}else show();
}).catch(()=>{document.getElementById('grid').textContent='No se pudieron cargar los indicadores.';});
</script>
</body>
</html>
