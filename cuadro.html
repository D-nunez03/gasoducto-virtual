<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuadro de mando · Junta Directiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#071a30;--ink:#0a2442;--ink-2:#17406a;--paper:#eef3f2;--muted:#b4c6cc;--accent:#f39b23;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--f-body:"IBM Plex Sans",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --p0:#f39b23;--p1:#4fd1c5;--p2:#5aa9ff;--p3:#b58cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--paper);font-family:var(--f-body)}
body{background:radial-gradient(1200px 600px at 85% -10%,#12406e 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#0d3355 0%,transparent 55%),var(--bg)}
/* Todo cabe en una pantalla: encabezado, 3 filas de 6 indicadores y pie */
.wrap{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:1.6vh;padding:2.4vh 2.2vw 1.8vh}
header{display:flex;align-items:center;justify-content:space-between;gap:2vw}
.brand{display:flex;align-items:center;gap:1.2vw}
.brand img{height:clamp(30px,5vh,52px);background:#fff;padding:.5vh .8vw;border-radius:6px}
.eyebrow{font-family:var(--f-mono);font-size:clamp(11px,1.5vh,15px);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{margin:.2vh 0 0;font-family:var(--f-display);font-weight:600;font-size:clamp(26px,5.2vh,56px);line-height:1}
.persp{display:flex;flex-wrap:wrap;gap:.6vh 1.4vw;justify-content:flex-end;font-family:var(--f-mono);font-size:clamp(11px,1.6vh,16px);color:var(--muted)}
.persp span::before{content:"";display:inline-block;width:.9em;height:.9em;border-radius:3px;background:var(--c);margin-right:.45em;vertical-align:-.08em}
.persp b{color:var(--paper);font-weight:500;background:var(--ink-2);padding:.15em .7em;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:1.4vh 1vw;min-height:0}
.tile{container-type:size;position:relative;background:color-mix(in srgb,var(--ink) 90%,transparent);border:1px solid var(--ink-2);border-radius:10px;overflow:hidden;
  opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.tile.in{opacity:1;transform:none}
.tile .c{position:absolute;inset:0;display:flex;flex-direction:column;padding:7cqh 6cqw 6cqh 8cqw}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--k,#5c6f7a)}
.top{display:flex;justify-content:space-between;align-items:center;gap:3cqw}
.top .pill{margin:0}
.tag{font-family:var(--f-mono);font-size:max(10px,7.5cqh);letter-spacing:.06em;text-transform:uppercase;color:var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn{font-size:max(12px,10cqh);line-height:1.15;font-weight:500;color:#e3ecee;margin-top:2cqh;min-height:2.3em}
.tv{display:flex;align-items:flex-end;justify-content:space-between;gap:4cqw;margin-top:auto}
.tv strong{font-family:var(--f-display);font-weight:600;font-size:min(27cqh,16cqw);line-height:.95;font-variant-numeric:tabular-nums;white-space:nowrap}
.tv strong small{font-size:.42em;font-weight:500;color:var(--muted);margin-left:.25em}
.pill{font-family:var(--f-mono);font-size:max(11px,9cqh);font-weight:600;padding:.2em .6em;border-radius:999px;background:var(--k);color:#08131d;white-space:nowrap;margin-bottom:.4em}
.pill.na{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.tp{display:flex;justify-content:space-between;gap:2cqw;margin-top:3cqh;font-family:var(--f-mono);font-size:max(10px,7.5cqh);color:var(--muted);white-space:nowrap}
.tp span:last-child{overflow:hidden;text-overflow:ellipsis}
.bar{height:max(3px,3cqh);border-radius:2px;background:#ffffff14;margin-top:3cqh;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--k);border-radius:2px;transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
footer{display:flex;justify-content:space-between;gap:2vw;flex-wrap:wrap;font-family:var(--f-mono);font-size:clamp(10px,1.45vh,14px);color:var(--muted)}
.leg i{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin:0 .35em 0 1.1em;vertical-align:-.05em}
.leg i:first-child{margin-left:.4em}
/* pantallas angostas: se permite el scroll */
@media (max-width:900px),(max-height:420px){.wrap{height:auto;min-height:100vh}.grid{grid-template-columns:repeat(2,1fr);grid-template-rows:none;grid-auto-rows:150px}header{flex-wrap:wrap}.persp{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){.tile,.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img src="logo.png" alt="Surtigas, una empresa Promigas">
      <div><div class="eyebrow">Gerencia de Operaciones</div><h1>Cuadro de mando</h1></div></div>
    <div class="persp" id="persp"></div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>
    <div class="leg" id="leg"></div>
    <div>% cumplimiento = Real / Meta · inversos (menor es mejor) = Meta / Real</div>
  </footer>
</div>
<script>
fetch('kpis.json?t='+Date.now()).then(r=>r.json()).then(K=>{
  const PC=['var(--p0)','var(--p1)','var(--p2)','var(--p3)'];
  const col=e=>{if(e==null)return null;for(const [m,c] of K.semaforo)if(e>=m)return c;return K.semaforo.at(-1)[1];};
  const fmt=e=>String(Math.round(e*10)/10).replace('.',',')+' %';
  document.getElementById('persp').innerHTML=`<b>${K.corte}</b>`+K.perspectivas.map((p,i)=>`<span style="--c:${PC[i]}">${p}</span>`).join('');
  document.getElementById('leg').innerHTML='Cumplimiento:'+K.semaforo.map(([m,c,t])=>`<i style="background:${c}"></i>${t}`).join('');
  const g=document.getElementById('grid');
  const ks=Object.values(K.kpis).sort((a,b)=>a.p-b.p);
  ks.forEach(k=>{
    const cc=col(k.ejec), u=k.unidad&&!/%/.test(k.unidad)&&k.unidad!=='#'?`<small>${k.unidad}</small>`:'';
    const t=document.createElement('div'); t.className='tile'; if(cc)t.style.setProperty('--k',cc); t.style.setProperty('--pc',PC[k.p]);
    t.innerHTML=`<div class="c"><div class="top"><div class="tag">${['Financiera','Mercado','Cliente','Procesos'][k.p]}</div><span class="pill${cc?'':' na'}">${cc?fmt(k.ejec):'pendiente'}</span></div><div class="tn">${k.nombre}</div>`+
      `<div class="tv"><strong>${k.real??'—'}${k.real?u:''}</strong></div>`+
      `<div class="tp"><span>Meta ${k.ppto??'—'}</span><span>${k.nota?'<b style="color:#f3d27a;font-weight:500">'+k.nota+'</b>':(k.inverso?'↓ mejor':'')}</span></div>`+
      `<div class="bar"><i data-w="${k.ejec==null?0:Math.min(100,k.ejec)}"></i></div></div>`;
    g.appendChild(t);});
  const tiles=[...g.querySelectorAll('.tile')];
  const show=()=>tiles.forEach((t,i)=>setTimeout(()=>{t.classList.add('in');const b=t.querySelector('.bar i');b.style.width=b.dataset.w+'%';},60*i));
  if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){show();io.disconnect();}},{threshold:.1});io.observe(g);}else show();
}).catch(()=>{document.getElementById('grid').textContent='No se pudieron cargar los indicadores.';});
</script>
</body>
</html>
